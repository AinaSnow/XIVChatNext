name: Relay
on:
  push:
    paths: ['src/**', 'tests/Relay/**', 'XIVChatCommon/**', 'deploy/relay/**', '.dockerignore', '.github/workflows/relay.yml']
  pull_request:
    paths: ['src/**', 'tests/Relay/**', 'XIVChatCommon/**', 'deploy/relay/**', '.dockerignore', '.github/workflows/relay.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - run: dotnet run --project tests/Relay/RelayTests.csproj -c Debug --no-launch-profile
      - run: docker build -f deploy/relay/Dockerfile -t xivchat-relay:ci .
      - name: Container startup and non-root storage
        run: |
          docker run -d --name relay-check -p 127.0.0.1:18080:8080 --read-only --tmpfs /tmp -v relay-check-data:/data xivchat-relay:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/healthz
          docker exec relay-check dotnet XIVChat.Relay.dll health
          docker exec relay-check dotnet XIVChat.Relay.dll list-devices
      - if: always()
        run: docker rm -f relay-check || true

 function toast(text){const box=root.querySelector('#xc-toast');box.textContent=text;box.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>box.hidden=true,2800)}
 function contacts(){
  const titles={conversations:'会话',channels:'频道',favorites:'收藏',history:'历史',events:'事件'};
  let content=`<div class="xc-listhead"><h2>${titles[state.route]}</h2><button data-action="new" aria-label="新建会话">${icon('square-pen')}</button></div>`;
  if(state.route==='conversations')content+=`<div class="xc-listfilter"><button class="${state.filter==='all'?'active':''}" data-filter="all">全部</button><button class="${state.filter==='unread'?'active':''}" data-filter="unread">未读 <span class="xc-count">2</span></button></div><div class="xc-sectionlabel">${icon('pin')}置顶会话</div>`+people.map((p,i)=>state.filter==='unread'&&i!==1?'':`<button class="xc-contact ${state.person===i?'active':''}" data-person="${i}">${avatar(p)}<div class="xc-contactcopy"><div class="xc-contactname">${p.name}<time>${p.time}</time></div><div class="xc-preview">${i===1?'<span class="xc-count">2</span> ':''}${p.last}</div></div></button>`).join('');
  else {const opts={channels:[['日常聊天','综合 · 部队 · 小队'],['副本交流','小队 · 团队 · 默契'],['装修采购','喊话 · 跨服通讯贝']],favorites:[['全部收藏','物品与地点'],['制作清单','3 件物品'],['装修灵感','2 个地点']],history:[['全部消息','按时间浏览'],['书签','保留的重要消息'],['我的备注','私人记录']],events:[['全部事件','排本与角色动态'],['游戏提醒','排本 · 悄悄话 · 关键词'],['连接记录','登录与断线']]}[state.route];content+=opts.map((x,i)=>`<button class="xc-contact ${i===0?'active':''}" data-category="${i}"><div class="xc-contactcopy"><div class="xc-contactname">${x[0]}</div><div class="xc-preview">${x[1]}</div></div></button>`).join('')}
  content+='<div class="xc-listfoot"><strong>Aina Snow · Tonberry</strong>当前角色的消息与未读独立保存</div>';list.innerHTML=content;
 }
 function head(title,subtitle,person){return `<header class="xc-contenthead"><div class="xc-heading">${person?avatar(person):''}<div><h2>${title}</h2><small>${subtitle}</small></div></div><div class="xc-actions"><button data-action="search" aria-label="搜索此会话">${icon('search')}</button><button data-action="popout" aria-label="弹出独立聊天窗口">${icon('picture-in-picture-2')}</button><button data-action="profile" aria-label="查看人物与头像设置">${icon('contact-round')}</button></div></header>`}
 function msg(p,time,text,extra='',own=false){return `<div class="xc-msg ${own?'own':''}">${avatar(p)}<div class="xc-msgcopy"><div class="xc-byline">${p.name}<time>${time}</time></div><p>${text}</p>${extra}</div></div>`}
 function item(){return `<button class="xc-linkitem" data-action="item"><span class="xc-itemicon">${icon('footprints')}</span><span class="xc-itemtext"><strong>工匠皮靴 <span class="xc-q">HQ</span></strong><small>装备 · 脚部 · 制作职业</small></span>${icon('chevron-right')}</button>`}
 function composer(pop=false){return `<div class="xc-composer"><div class="xc-recipient">${icon('corner-up-left')}发送至 ${state.route==='channels'?'小队频道':esc(people[state.person].name)+' @ '+people[state.person].world}</div><textarea id="${pop?'xc-pop-input':'xc-input'}" aria-label="${pop?'小窗':'会话'}消息输入" placeholder="输入消息…">${esc(state.drafts[(pop?'pop':'main')+state.person]||'')}</textarea><div class="xc-composerfoot"><button data-action="emoji" aria-label="插入表情">${icon('smile')}</button><span>Enter 发送 · Shift + Enter 换行</span><button class="xc-primary" data-action="${pop?'sendpop':'send'}">发送 ${icon('arrow-up')}</button></div></div>`}
 function detail(){return `<aside class="xc-inspector" aria-label="物品详情"><div class="xc-detailtop">物品详情 · 示例<button data-action="close-detail" aria-label="收起详情">${icon('panel-right-close')}</button></div><div class="xc-herocard"><div class="xc-itemicon">${icon('footprints')}</div><div><h3>工匠皮靴 <span class="xc-q">HQ</span></h3><small>制作职业 · 脚部</small></div></div><div class="xc-detailbuttons"><button class="${state.saved?'saved':''}" data-action="favorite">${icon(state.saved?'bookmark-check':'bookmark')}${state.saved?'已收藏':'收藏'}</button><button data-action="copy">${icon('copy')}复制名称</button></div><div class="xc-detailtabs">${[['compare','装备对比'],['recipe','制作'],['sources','来源']].map(t=>`<button class="${state.tab===t[0]?'active':''}" data-detail="${t[0]}">${t[1]}</button>`).join('')}</div><div id="xc-detail-content">${detailContent()}</div><div class="xc-detailsection"><h3>私人备注</h3><input class="xc-note" aria-label="物品私人备注" value="下一次制作前换上这双"></div><div class="xc-detailsection"><h3>分享来源</h3><p>Miko Tsuki · 今天 21:40<br>Aina Snow @ Tonberry</p><button class="xc-sourcelink" data-action="source">跳到原消息 ${icon('arrow-up-right')}</button></div><div class="xc-detailsection"><small>演示属性 · 实际以游戏数据为准</small></div></aside>`}
 function detailContent(){if(state.tab==='recipe')return `<small>制革匠 · 配方示意</small><div class="xc-kv"><span>精制皮革</span><span>× 2</span></div><div class="xc-kv"><span>耐用丝线</span><span>× 1</span></div><div class="xc-kv"><span>橡胶</span><span>× 1</span></div><div class="xc-detailsection"><h3>制作产量</h3><p>每次制作 1 件</p></div>`;if(state.tab==='sources')return `<div class="xc-detailsection"><h3>制作获取</h3><p>查看制革匠配方与材料清单。</p></div><div class="xc-detailsection"><h3>金币商店 / 采集</h3><p>暂无可确认的直接获取来源。</p></div>`;return `<small>与当前装备相比 · 基础属性</small><div class="xc-kv"><span>作业精度</span><span>164 <em>+ 8</em></span></div><div class="xc-kv"><span>加工精度</span><span>82 <em>+ 5</em></span></div><div class="xc-kv"><span>制作力</span><span>8 <em>+ 1</em></span></div><div class="xc-detailsection"><h3>当前装备镶嵌</h3><p>名匠魔晶石 × 1<br>巨匠魔晶石 × 1</p><small>镶嵌属性单独列出</small></div>`}
 function chat(){const p=people[state.person];let body;if(state.route==='channels')body=msg(p,'21:38','等大家到齐就出发吧。')+msg(people[1],'21:39','我切个职业，马上。')+msg(self,'21:40','好，我在门口等你们。','',true);else if(state.person===0)body=msg(p,'21:38','今天做生产装备？我刚好整理了一份材料清单。')+msg(self,'21:39','好呀，先看看鞋子，我这件该换了。','',true)+msg(p,'21:40','这双可以先做，材料也比较好准备。',item())+msg(self,'21:41','收到，先收藏一下，晚上一起做。','',true)+msg(p,'21:42','我把集合地点也发给你了。',`<button class="xc-inline-location" data-action="location">${icon('map-pin')}薰衣草苗圃 (X:11.2, Y:8.4)</button>`);else body=msg(p,'21:36',esc(p.last))+msg(self,'21:37','可以，我把手头的事情做完就来。','',true);
 const extra=state.messages.filter(m=>m.person===state.person&&m.route===state.route).map(m=>msg(self,'现在',esc(m.text),'',true)).join('');
 main.innerHTML=head(state.route==='channels'?'副本交流':p.name,state.route==='channels'?'小队 · 团队 · 默契':p.world+' · 悄悄话',state.route==='channels'?null:p)+`<div class="xc-workarea ${state.details?'':'no-detail'}"><section class="xc-chat" aria-label="聊天记录"><div class="xc-thread"><div class="xc-date">今天 · 9 月 8 日</div>${body}${extra}<div class="xc-read">消息已同步至本地</div></div>${composer()}</section>${state.details?detail():''}</div>`;if(!state.details)main.querySelector('.xc-workarea').style.gridTemplateColumns='minmax(0,1fr)';}
 function favorites(){main.innerHTML=head('收藏','把有用的物品、地点和分享来源留在一起')+`<section class="xc-page"><div class="xc-pagelead"><div><h2>你的冒险备忘</h2><small>收藏跨角色可见 · 来源始终保留</small></div><button data-action="group">${icon('folder-plus')}新建分组</button></div><div class="xc-pagetabs"><button class="active" data-favfilter="all">全部</button><button data-favfilter="item">物品</button><button data-favfilter="place">地点</button></div><div class="xc-favgrid"><article class="xc-favcard" data-kind="item"><div class="xc-herocard"><div class="xc-itemicon">${icon('footprints')}</div><div><h3>工匠皮靴 <span class="xc-q">HQ</span></h3><small>装备 · 脚部</small></div></div><p>下一次制作前换上这双</p><div class="xc-tags"><span class="xc-tag">制作清单</span><span class="xc-tag">待制作</span></div><div class="xc-favfoot"><small>Miko Tsuki · 今天</small><button data-action="item">查看详情 ${icon('arrow-up-right')}</button></div></article><article class="xc-favcard" data-kind="place"><div class="xc-herocard"><div class="xc-itemicon">${icon('map-pin')}</div><div><h3>薰衣草苗圃</h3><small>X:11.2 · Y:8.4</small></div></div><p>晚上一起做装备的集合地点</p><div class="xc-tags"><span class="xc-tag">集合地点</span><span class="xc-tag">装修灵感</span></div><div class="xc-favfoot"><small>Miko Tsuki · 今天</small><button data-action="location">查看地点 ${icon('arrow-up-right')}</button></div></article></div><div class="xc-detailsection"><small>以上来源角色：Aina Snow @ Tonberry</small></div></section>`}
 const records=[{who:'Miko Tsuki',text:'这双工匠皮靴可以先做，材料也比较好准备。',time:'今天 21:40',kind:'悄悄话'},{who:'Aina Snow',text:'收到，先收藏一下，晚上一起做。',time:'今天 21:41',kind:'悄悄话'},{who:'Yuki Shiro',text:'装修用的材料已经备好了。',time:'今天 20:58',kind:'悄悄话'},{who:'Haru Rain',text:'等大家到齐就出发吧。',time:'昨天 22:13',kind:'小队'}];
 function results(q=''){const rows=records.filter(r=>(r.text+r.who).toLowerCase().includes(q.toLowerCase()));return `<small>${rows.length} 条结果 · 当前角色 Aina Snow @ Tonberry</small>`+rows.map(r=>`<article class="xc-result"><div class="xc-resulthead"><span>${r.who} · ${r.kind}</span><time>${r.time}</time></div><p>${q?esc(r.text).replaceAll(esc(q),'<mark>'+esc(q)+'</mark>'):esc(r.text)}</p><button data-action="context">查看上下文 ${icon('arrow-up-right')}</button></article>`).join('')}
 function history(){main.innerHTML=head('历史','搜索已经聊过的事，也找回当时的上下文')+`<section class="xc-page"><div class="xc-historysearch"><input id="xc-history-input" aria-label="搜索历史" placeholder="搜索消息或角色名" value="${esc(state.query)}"><select aria-label="消息频道" id="xc-history-kind"><option>全部频道</option><option>悄悄话</option><option>小队</option></select><button data-action="export">${icon('download')}导出</button></div><div id="xc-results" aria-live="polite">${results(state.query)}</div></section>`}
 function events(){main.innerHTML=head('事件','重要的游戏动态，按时间放在这里')+`<section class="xc-page"><div class="xc-pagelead"><h2>今天</h2><button data-action="dnd">${icon('moon')}免打扰：关</button></div>${[['swords','排本已就绪','随机任务已匹配，提醒已发送。','21:32'],['message-circle','新的悄悄话','Haru Rain：一会儿来打随机吗？','21:36'],['map-pin','进入薰衣草苗圃','角色位置变化 · 仅记录','21:20'],['wifi','已连接到游戏','Aina Snow @ Tonberry · 历史已同步','20:45']].map(e=>`<article class="xc-event"><div class="xc-eventicon">${icon(e[0])}</div><div class="xc-eventcopy"><h3>${e[1]}</h3><p>${e[2]}</p></div><small>${e[3]}</small></article>`).join('')}</section>`}
 function render(){contacts();root.querySelectorAll('[data-route]').forEach(b=>{if(b.dataset.route===state.route)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});if(['conversations','channels'].includes(state.route))chat();else if(state.route==='favorites')favorites();else if(state.route==='history')history();else events();icons()}
 function navigate(route){state.route=route;state.filter='all';render()}
 function showPopup(){popup.hidden=false;popup.innerHTML=`<div class="xc-pophead"><span>${icon('picture-in-picture-2')} ${esc(people[state.person].name)} · 独立小窗</span><div><button data-action="pinpop" aria-label="置顶小窗">${icon('pin')}</button><button data-action="closepop" aria-label="关闭小窗">${icon('x')}</button></div></div><div class="xc-popbody"><small>${people[state.person].world} · 悄悄话</small><p style="font-size:12px;margin-top:12px">${esc(people[state.person].last)}</p><small>与主窗口共享消息和已读状态</small></div>${composer(true)}`;icons()}
 function send(pop){const input=root.querySelector(pop?'#xc-pop-input':'#xc-input');if(!input||!input.value.trim())return;state.messages.push({person:state.person,route:state.route,text:input.value.trim()});state.drafts[(pop?'pop':'main')+state.person]='';render();if(pop)showPopup();toast('已加入原型对话 · 不会发送到游戏')}
 root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.route){navigate(b.dataset.route);return}if(b.dataset.person!==undefined){state.person=Number(b.dataset.person);render();return}if(b.dataset.filter){state.filter=b.dataset.filter;contacts();icons();return}if(b.dataset.detail){state.tab=b.dataset.detail;root.querySelectorAll('[data-detail]').forEach(t=>t.classList.toggle('active',t===b));root.querySelector('#xc-detail-content').innerHTML=detailContent();return}if(b.dataset.favfilter){root.querySelectorAll('[data-favfilter]').forEach(t=>t.classList.toggle('active',t===b));root.querySelectorAll('[data-kind]').forEach(c=>c.hidden=b.dataset.favfilter!=='all'&&c.dataset.kind!==b.dataset.favfilter);return}if(b.dataset.category!==undefined){root.querySelectorAll('[data-category]').forEach(t=>t.classList.toggle('active',t===b));toast('已选择 '+b.querySelector('.xc-contactname').textContent);return}
 const action=b.dataset.action;
 if(action==='item'){state.details=true;if(!['conversations','channels'].includes(state.route)){state.route='conversations';state.person=0;render()}else render();main.querySelector('.xc-workarea').classList.add('inspect-open')}
 else if(action==='favorite'){state.saved=!state.saved;b.classList.toggle('saved',state.saved);b.innerHTML=icon(state.saved?'bookmark-check':'bookmark')+(state.saved?'已收藏':'收藏');icons();toast(state.saved?'已保存到「制作清单」':'已取消收藏')}
 else if(action==='close-detail'){state.details=false;render()}
 else if(action==='popout')showPopup();else if(action==='closepop')popup.hidden=true;else if(action==='pinpop'){b.classList.toggle('saved');toast(b.classList.contains('saved')?'小窗置顶效果已开启':'已取消小窗置顶')}
 else if(action==='send')send(false);else if(action==='sendpop')send(true);
 else if(action==='search'){navigate('history');root.querySelector('#xc-history-input').focus()}
 else if(action==='source'||action==='context'){state.person=0;navigate('conversations');toast('已定位到今天 21:40 的分享消息')}
 else if(action==='profile'){popup.hidden=false;popup.innerHTML=`<div class="xc-pophead"><span>角色资料与头像</span><button data-action="closepop" aria-label="关闭角色资料">${icon('x')}</button></div><div class="xc-popbody"><div class="xc-herocard">${avatar(people[state.person])}<div><h3>${people[state.person].name}</h3><small>${people[state.person].world}</small></div></div><p style="font-size:12px">Lodestone 头像：自动匹配</p><label style="font-size:11px;color:var(--xc-muted)">手动指定角色 ID 或链接<input class="xc-note" id="xc-avatar-url" placeholder="例如 22586842" style="margin-top:6px"></label><button class="xc-primary" data-action="bind-avatar" style="margin-top:14px">预览绑定</button><p style="font-size:10px;color:var(--xc-muted);margin-top:12px">原型使用占位头像，未进行在线查询。</p></div>`;icons()}
 else if(action==='bind-avatar')toast('绑定流程示意 · 正式版本会核对角色名与所属服务器');
 else if(action==='location'){popup.hidden=false;popup.innerHTML=`<div class="xc-pophead"><span>地点详情</span><button data-action="closepop" aria-label="关闭地点详情">${icon('x')}</button></div><div class="xc-popbody"><div class="xc-herocard"><span class="xc-itemicon">${icon('map-pin')}</span><div><h3>薰衣草苗圃</h3><small>X:11.2 · Y:8.4</small></div></div><p style="font-size:12px">晚上一起做装备的集合地点</p><small>Miko Tsuki 分享 · 今天 21:42</small><div class="xc-detailbuttons" style="margin-top:15px"><button data-action="favorite">${icon('bookmark')}收藏</button><button data-action="source">查看来源</button></div></div>`;icons()}
 else if(action==='dnd'){const on=b.dataset.on!=='true';b.dataset.on=String(on);b.innerHTML=icon('moon')+'免打扰：'+(on?'开':'关');icons()}
 else if(action==='emoji'){const input=root.querySelector('#xc-input');if(input){input.value+=' ( ´ ▽ ` )';state.drafts['main'+state.person]=input.value;input.focus()}}
 else if(action==='layout'){state.compact=!state.compact;applyDesign();toast(state.compact?'已切换到紧凑布局':'已切换到舒适布局')}
 else toast(({copy:'工匠皮靴 HQ · 名称复制操作示意',export:'可导出当前搜索结果或选定时间段',group:'分组创建入口示意',new:'新会话可输入角色名与所属服务器',settings:'设置包含：连接、历史、通知、头像与外观'})[action]||'');
 });
 root.addEventListener('input',e=>{if(e.target.id==='xc-history-input'){state.query=e.target.value;root.querySelector('#xc-results').innerHTML=results(state.query);icons()}if(['xc-input','xc-pop-input'].includes(e.target.id))state.drafts[(e.target.id==='xc-input'?'main':'pop')+state.person]=e.target.value});
 root.addEventListener('change',e=>{if(e.target.id==='xc-history-kind'){root.querySelectorAll('.xc-result').forEach(r=>r.hidden=e.target.value!=='全部频道'&&!r.querySelector('.xc-resulthead').textContent.includes(e.target.value))}});
 root.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='xc-global-search'){state.query=e.target.value;navigate('history')}else if(e.key==='Enter'&&!e.shiftKey&&['xc-input','xc-pop-input'].includes(e.target.id)){e.preventDefault();send(e.target.id==='xc-pop-input')}if(e.key==='Escape')popup.hidden=true});
 function applyDesign(){root.style.setProperty('--xc-space',state.compact?'11px':'18px');root.style.colorScheme=state.theme==='system'?'light dark':state.theme;const palettes={blue:['light-dark(#315fc3,#96b5ff)','light-dark(#e8efff,#293c5b)'],teal:['light-dark(#17736d,#8dd4c9)','light-dark(#e2f2ef,#25453f)'],violet:['light-dark(#7150b3,#c3abff)','light-dark(#efe9fa,#403254)']};root.style.setProperty('--xc-accent',palettes[state.accent][0]);root.style.setProperty('--xc-soft',palettes[state.accent][1]);root.querySelectorAll('.xc-msg').forEach(m=>m.style.marginBottom=state.compact?'11px':'18px')}
 render();applyDesign();
 if(globalThis.Tweak){const tweak=new globalThis.Tweak({container:root,onChange:()=>{render();applyDesign()}});tweak.addSelect(state,'theme',{label:'外观',options:[{label:'跟随系统',value:'system'},{label:'浅色',value:'light'},{label:'深色',value:'dark'}]});tweak.addSelect(state,'accent',{label:'强调色',options:[{label:'水晶蓝',value:'blue'},{label:'青绿',value:'teal'},{label:'薰衣草紫',value:'violet'}]});tweak.addToggle(state,'compact',{label:'紧凑消息间距'});tweak.addToggle(state,'details',{label:'显示物品详情侧栏'})}
})();
</script>
